name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Cache saves are restricted to main and dev. Pull requests and any
# other branches (if the trigger is later widened) restore from cache
# but do not write new entries. This keeps the cache namespace small
# and avoids cache churn from transient branches.
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}

      - name: Install Linux deps (libsecret, openssl)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config libssl-dev

      - name: cargo test (keychain feature enabled)
        run: cargo test --workspace --features career-ops-app/keychain

  test-no-secret-service:
    name: test (no keychain feature, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}

      # Note: this job verifies that career-ops-core compiles and its
      # tests pass when the `keychain` feature is not enabled. It does
      # not simulate an unavailable OS keychain — the tests use
      # career-ops-test-support::install(), which is a process-local
      # in-memory backend and does not require a real keychain.
      - name: cargo test without keychain feature
        run: cargo test -p career-ops-core --no-default-features

  keychain-sentinel:
    name: keychain sentinel round-trip (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config libssl-dev

      - name: Run sentinel test
        run: cargo test -p career-ops-core --features keychain keychain_sentinel_round_trip

  never-reinitialize:
    name: never-reinitialize safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}

      - name: Run never-reinitialize test
        run: cargo test -p career-ops-core --features keychain initialize_refuses_when_wrapped_file_exists

  fmt-clippy:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings