[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]
exclude = ["spikes"]

[workspace.package]
edition = "2021"
# `rig` 0.46 requires rustc 1.97.1, so the workspace MSRV follows the
# dependency rather than the other way round. Check `rig`'s `rust-version`
# before any future bump.
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
career-ops-test-support = { path = "crates/test-support" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
    "chrono",
    "uuid",
    "json",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1", features = ["derive"] }