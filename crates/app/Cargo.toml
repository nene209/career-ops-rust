[package]
name = "career-ops-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "career-ops"
path = "src/main.rs"

[features]
default = ["keychain"]
keychain = ["career-ops-core/keychain"]

[dependencies]
career-ops-core = { path = "../core", features = [] }
anyhow.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
zeroize.workspace = true
serde_json.workspace = true

egui = "0.37"
eframe = "0.37"

[dev-dependencies]
career-ops-core = { path = "../core", features = ["keychain"] }
career-ops-test-support = { workspace = true }
egui_kittest = { version = "0.37", features = ["snapshot", "wgpu"] }
keyring = "3"
sqlx = { workspace = true }
tempfile = "3"
